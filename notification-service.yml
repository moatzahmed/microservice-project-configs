server:
  port: 8083

spring:
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0
          max-interval: 10000
        default-requeue-rejected: false

logging:
  pattern:
    correlation: "[%X{correlationId:-no-correlation}] "
