server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/meeting-room}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: room-service
              uri: ${ROOM_SERVICE_URL:lb://room-service}
              predicates:
                - Path=/api/rooms/**
            - id: booking-service-rate-limited
              uri: ${BOOKING_SERVICE_URL:lb://booking-service}
              predicates:
                - Path=/api/bookings/**
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@authenticatedUserKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 60
                    redis-rate-limiter.requestedTokens: 6
            - id: booking-service
              uri: ${BOOKING_SERVICE_URL:lb://booking-service}
              predicates:
                - Path=/api/bookings/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,busrefresh,gateway
  endpoint:
    gateway:
      access: read-only
