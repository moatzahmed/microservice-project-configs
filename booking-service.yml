server:
  port: 8082

spring:
  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:5434/booking_db}
    username: ${BOOKING_DB_USERNAME}
    password: ${BOOKING_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

logging:
  pattern:
    correlation: "[%X{correlationId:-no-correlation}] "

clients:
  room-service:
    base-url: ${ROOM_SERVICE_BASE_URL:http://room-service}
    discovery-enabled: ${ROOM_SERVICE_DISCOVERY_ENABLED:true}
    connect-timeout: ${ROOM_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${ROOM_SERVICE_READ_TIMEOUT:3s}

resilience4j:
  bulkhead:
    bulkhead-aspect-order: 0
    instances:
      roomService:
        maxConcurrentCalls: 10
        maxWaitDuration: 0
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      roomService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.learning.meetingrooms.booking.application.RoomServiceUnavailableException
  retry:
    retry-aspect-order: 2
    instances:
      roomService:
        maxAttempts: 2
        waitDuration: 100ms
        retryExceptions:
          - com.learning.meetingrooms.booking.application.RoomServiceUnavailableException

management:
  endpoints:
    web:
      exposure:
        include: health,info,busrefresh,bulkheads,bulkheadevents,circuitbreakers,circuitbreakerevents,retries,retryevents
test:
  message: "Good Bye!"
